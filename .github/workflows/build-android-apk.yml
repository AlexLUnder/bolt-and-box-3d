name: Build Android APK (Bolt & Box 3D)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Debug APK (ready to sideload on Fold 8)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BoltAndBox3D-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltAndBox3D-debug-apk
          path: BoltAndBox3D-debug.apk

      - name: Publish direct-download Release (latest-apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk BoltAndBox3D-debug.apk --clobber
          else
            gh release create latest-apk BoltAndBox3D-debug.apk \
              --title "Bolt & Box 3D — Latest Android APK" \
              --notes "Direct sideload APK optimized for Galaxy Z Fold (cover + unfolded)."
          fi

      # Optional Google Play Internal Testing signed .aab build.
      # Automatically skipped until ANDROID_KEYSTORE_BASE64 secret is added to the repo.
      - name: Build & sign Release AAB (Google Play Internal Testing)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not configured — skipping signed AAB build."
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"

          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if ! unzip -l "$AAB_PATH" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)$'; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASS" \
              "$AAB_PATH" "$ANDROID_KEY_ALIAS"
          fi
          jarsigner -verify "$AAB_PATH"
          cp "$AAB_PATH" ../BoltAndBox3D-release.aab
          rm -f "$KEYSTORE_PATH"

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltAndBox3D-release-aab
          path: BoltAndBox3D-release.aab
          if-no-files-found: ignore
